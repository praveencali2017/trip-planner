name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Group by source repo + branch name so a branch push and its PR share one group (the later
# run cancels the earlier, instead of every PR update running CI twice), while a fork's PR
# from e.g. its own `main` never shares a group with — and cancels — this repo's `main`.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        # Python version comes from .python-version; --locked fails if uv.lock is out of date.
        run: uv sync --locked

      - name: Run tests
        # The suite fakes OpenAI and YouTube, so no API keys are needed.
        run: uv run pytest -v

  frontend:
    name: Frontend build, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
